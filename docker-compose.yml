services:
  postgres:
    image: postgres:17-alpine
    container_name: learnpattern-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-learnpattern_db}
      POSTGRES_USER: ${POSTGRES_USER:-learnpattern_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-learnpattern_local_2026}
    ports:
      - "5432:5432"
    volumes:
      - learnpattern_data:/var/lib/postgresql/data
      - ./database/scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-learnpattern_user} -d ${POSTGRES_DB:-learnpattern_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  ai:
    build:
      context: ./ai
    container_name: learnpattern-ai
    restart: unless-stopped
    environment:
      ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173,http://backend:8080
    ports:
      - "8000:8000"

  backend:
    build:
      context: ./backend
    container_name: learnpattern-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      ai:
        condition: service_started
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-learnpattern_db}
      POSTGRES_USER: ${POSTGRES_USER:-learnpattern_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-learnpattern_local_2026}
      AI_SERVICE_URL: http://ai:8000
      JWT_SECRET: ${JWT_SECRET:-LearnPattern_Clave_Secreta_Dev_2026_Minimo_32_Chars}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8080
    container_name: learnpattern-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  learnpattern_data: