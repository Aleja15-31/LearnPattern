spring.application.name=learnpattern-backend
server.port=${SERVER_PORT:8080}

spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]

spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:learnpattern_db}
spring.datasource.username=${POSTGRES_USER:learnpattern_user}
spring.datasource.password=${POSTGRES_PASSWORD:learnpattern_local_2026}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

ai.service.url=${AI_SERVICE_URL:http://localhost:8000}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}